<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04060C">
<title>Chengdu, December 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300..700&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="config.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<style>
:root{
  --space:#04060C; --space-2:#080D19; --panel:#0D1324; --panel-2:#141B31; --glass:rgba(12,18,34,.74);
  --ink:#ECF1FA; --ink-2:#B4BED2; --mute:#7C879F; --line:rgba(236,241,250,.10); --line-2:rgba(236,241,250,.18);
  --amber:#FFB547; --trip:#3CCBB4; --spa:#B794F6; --ga:#FF6FA3; --amber-soft:rgba(255,181,71,.16); --amber-ink:#241600; --sky:#86BBFF;
  --l3:#FFB547; --l2:#6FD0AE; --l1:#97A9D6; --l0:#EF7F7F;
  --sans:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --zh:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --r-lg:22px; --r-md:14px; --r-sm:9px;
  --topbar:64px; --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--space);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:6px}
a,button,.row,.chip,.pin{touch-action:manipulation}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.zh{font-family:var(--zh)}

/* ---------- Top bar ---------- */
.topbar{position:fixed;z-index:1000;top:0;left:0;right:0;height:calc(var(--topbar) + var(--safe-t));padding:var(--safe-t) clamp(14px,3vw,32px) 0;display:flex;align-items:center;gap:16px;transition:background .3s,border-color .3s;border-bottom:1px solid transparent}
body:not([data-page="home"]) .topbar{background:rgba(6,9,18,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom-color:var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none;flex-shrink:0}
.brand .zh{font-weight:900;font-size:22px;letter-spacing:.04em}
.brand small{font-size:13px;color:var(--ink-2)}
.tabs{display:flex;gap:2px;margin-left:auto;background:rgba(236,241,250,.06);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs a{padding:6px 14px;border-radius:999px;text-decoration:none;font-size:14.5px;font-weight:500;color:var(--ink-2)}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{background:var(--ink);color:var(--space)}
.who-chip{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;border:1px solid var(--line-2);background:rgba(236,241,250,.05);cursor:pointer;font-size:14.5px;font-weight:500;flex-shrink:0;white-space:nowrap}
.who-chip:hover{background:rgba(236,241,250,.1)}
.avatar{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:700;background:var(--panel-2);color:var(--ink);border:1px solid var(--line-2)}
.avatar.empty{background:transparent;border-style:dashed}

/* ---------- Pages ---------- */
.page{display:none}
.page.is-active{display:block}

/* ---------- Home ---------- */
#page-home{position:fixed;inset:0;overflow:hidden;background:
  radial-gradient(1100px 680px at 82% 4%, rgba(48,96,168,.17), transparent 62%),
  radial-gradient(800px 520px at 8% 22%, rgba(30,128,140,.08), transparent 60%),
  var(--space)}
#globe{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity 1.8s ease}
#globe.ready{opacity:1}
.globe-labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.g-label{position:absolute;left:0;top:0;font-size:13px;font-weight:500;color:var(--ink-2);white-space:nowrap;text-shadow:0 1px 10px rgba(0,0,0,.95),0 0 2px rgba(0,0,0,.9);transition:opacity .4s;will-change:transform}
.g-label.dest{color:var(--amber);font-weight:600}
.home-copy{position:absolute;z-index:2;left:clamp(20px,6vw,96px);right:20px;top:calc(var(--topbar) + var(--safe-t) + clamp(18px,7vh,84px))}
.hello{margin:0 0 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:16px;color:var(--ink-2)}
.hello strong{color:var(--ink);font-weight:600}
.link-btn{background:none;border:0;padding:2px 4px;margin:-2px -4px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-2);cursor:pointer;font-size:inherit}
.link-btn:hover{color:var(--ink)}
.home-dates{margin:0 0 8px;font-size:15px;color:var(--ink-2)}
.home-title{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:.26em;line-height:.9}
.home-title .en{font-weight:300;font-size:clamp(62px,11.5vw,160px);letter-spacing:-.045em}
.home-title .zh{font-weight:900;font-size:clamp(36px,5.6vw,82px);letter-spacing:.06em;color:var(--ink)}
.cta{display:inline-flex;align-items:center;gap:14px;margin-top:30px;padding:7px 7px 7px 22px;border-radius:999px;background:rgba(236,241,250,.08);border:1px solid var(--line-2);color:var(--ink);font-weight:500;font-size:16px;text-decoration:none;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);cursor:pointer;transition:background .2s}
.cta:hover{background:rgba(236,241,250,.15)}
.cta .ic{width:40px;height:40px;border-radius:50%;background:var(--amber);color:var(--amber-ink);display:grid;place-items:center;flex-shrink:0}
.cta.solid{background:var(--amber);color:var(--amber-ink);border-color:transparent;padding:7px 7px 7px 22px;font-weight:600}
.cta.solid .ic{background:var(--amber-ink);color:var(--amber)}
.cta.solid:hover{background:#ffc366}
.home-strip{position:absolute;z-index:2;left:0;right:0;bottom:0;padding:90px clamp(20px,6vw,96px) calc(26px + var(--safe-b));background:linear-gradient(to bottom,transparent,rgba(4,6,12,.72) 45%,rgba(4,6,12,.94))}

/* ---------- Flight strip ---------- */
.strip-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:16px}
.strip-city{font-size:21px;font-weight:600;line-height:1.15}
.strip-city small{display:block;font-size:13.5px;font-weight:400;color:var(--ink-2);margin-top:3px}
.strip-city.right{text-align:right}
.strip-status{align-self:center;font-size:14px;color:var(--ink);background:rgba(236,241,250,.07);border:1px solid var(--line);padding:5px 12px;border-radius:999px;white-space:nowrap}
.strip-status b{color:var(--amber);font-weight:600}
.strip-track{position:relative;height:44px;margin:0 6px}
.strip-track .base{position:absolute;left:0;right:0;top:12px;height:2px;border-radius:2px}
.strip-track .seg{position:absolute;top:12px;height:2px}
.seg.fly{background:rgba(236,241,250,.30)}
.seg.wait{background:repeating-linear-gradient(90deg,rgba(236,241,250,.42) 0 3px,transparent 3px 7px)}
.strip-track .done{position:absolute;left:0;top:12px;height:2px;background:var(--amber);box-shadow:0 0 12px rgba(255,181,71,.55);border-radius:2px}
.node{position:absolute;top:13px;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:var(--space);border:2px solid rgba(236,241,250,.6)}
.node.passed{border-color:var(--amber);background:var(--amber)}
.node-label{position:absolute;top:15px;left:50%;transform:translateX(-50%);font-size:13px;color:var(--ink-2);white-space:nowrap}
.node.first .node-label{left:-3px;transform:none}
.node.last .node-label{left:auto;right:-3px;transform:none}
.node-label .code{display:none}
.strip-plane{position:absolute;top:13px;width:24px;height:24px;margin:-12px 0 0 -12px;color:var(--ink);filter:drop-shadow(0 0 6px rgba(255,181,71,.8))}

/* ---------- Scroll pages ---------- */
.wrap{max-width:1040px;margin:0 auto;padding:calc(var(--topbar) + var(--safe-t) + 44px) clamp(18px,5vw,48px) calc(96px + var(--safe-b))}
.page-title{margin:0;font-weight:300;font-size:clamp(40px,6.4vw,68px);letter-spacing:-.035em;line-height:1}
.page-sub{margin:12px 0 0;color:var(--ink-2);font-size:17px;max-width:60ch}
#page-journey,#page-results{min-height:100vh;background:radial-gradient(900px 500px at 85% -10%, rgba(48,96,168,.14), transparent 60%),var(--space)}

/* Journey */
.trip-card{margin-top:40px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:clamp(18px,3vw,32px)}
.trip-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:26px}
.trip-top h2{margin:0;font-size:24px;font-weight:600;letter-spacing:-.01em}
.trip-top .total{color:var(--ink-2);font-size:15px}
.trip-top .total b{color:var(--ink);font-weight:600}
.legs{list-style:none;margin:28px 0 0;padding:0}
.leg{padding:20px 0;border-top:1px solid var(--line)}
.leg-meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--mute);margin-bottom:14px}
.leg-meta .when{color:var(--ink-2);font-weight:600}
.leg-meta .fno{color:var(--ink);font-weight:600;letter-spacing:.02em}
.leg-main{display:grid;grid-template-columns:minmax(0,1fr) minmax(90px,1.1fr) minmax(0,1fr);align-items:start;gap:16px}
.pt .time{font-size:clamp(26px,3.4vw,34px);font-weight:300;letter-spacing:-.02em;line-height:1}
.pt .time sup{font-size:.45em;font-weight:600;color:var(--amber);margin-left:2px;vertical-align:top;position:relative;top:.1em}
.pt .code{font-size:15px;font-weight:700;letter-spacing:.06em;margin-top:6px}
.pt .ap{font-size:14px;color:var(--ink-2);margin-top:2px;line-height:1.4}
.pt.end{text-align:right}
.leg-line{position:relative;margin-top:16px;height:2px;background:linear-gradient(90deg,transparent,rgba(236,241,250,.35) 12%,rgba(236,241,250,.35) 88%,transparent)}
.leg-line span{position:absolute;left:50%;top:-30px;transform:translateX(-50%);font-size:14px;color:var(--ink-2);white-space:nowrap}
.leg-line svg{position:absolute;left:50%;top:-9px;margin-left:-9px;color:var(--ink)}
.conn{display:flex;align-items:center;gap:10px;padding:12px 16px;margin:2px 0;border-radius:var(--r-sm);background:rgba(236,241,250,.035);border:1px dashed var(--line-2);font-size:14.5px;color:var(--ink-2);list-style:none}
.conn b{color:var(--ink);font-weight:600}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:40px}
.fact{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:18px 20px}
.fact .big{font-size:28px;font-weight:300;letter-spacing:-.02em;line-height:1.1}
.fact p{margin:6px 0 0;font-size:14.5px;color:var(--ink-2)}
.hotel-card{margin-top:40px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.hotel-card .ph{min-height:260px;background:var(--panel-2);position:relative}
.hotel-card .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hotel-card .tx{padding:clamp(20px,3vw,32px)}
.hotel-card .label{font-size:14px;color:var(--amber);font-weight:600;margin:0 0 10px}
.hotel-card h3{margin:0;font-size:26px;font-weight:600;letter-spacing:-.01em;line-height:1.15}
.hotel-card .zh{margin:8px 0 0;font-size:18px;font-weight:700;color:var(--ink-2)}
.hotel-card ul{list-style:none;padding:0;margin:18px 0 22px;font-size:15px;color:var(--ink-2)}
.hotel-card li{padding:7px 0;border-top:1px solid var(--line)}
.hotel-card li:first-child{border-top:0}
.journey-end{margin-top:56px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.journey-end p{margin:0;font-size:20px;font-weight:300;max-width:34ch}

/* ---------- Explore ---------- */
#page-explore{position:fixed;inset:0}
#map{position:absolute;inset:0;background:#0A0E18}
.leaflet-container{font-family:var(--sans);background:#0A0E18}
.leaflet-control-attribution{background:rgba(6,9,18,.72)!important;color:var(--mute)!important;font-size:11px}
.leaflet-control-attribution a{color:var(--ink-2)!important}
.leaflet-bar a{background:var(--panel)!important;color:var(--ink)!important;border-color:var(--line)!important}
.leaflet-bar{border:1px solid var(--line)!important;box-shadow:none!important}
.leaflet-bottom.leaflet-left{margin-bottom:var(--safe-b)}
.pin-anchor{width:0!important;height:0!important;background:none;border:0}
.pin{position:absolute;left:0;bottom:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;cursor:pointer;padding-bottom:10px}
.pin::after{content:"";position:absolute;bottom:0;left:50%;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 3px rgba(4,6,12,.6)}
.pin-photo{position:relative;width:44px;height:44px;border-radius:50%;overflow:hidden;background:var(--panel-2);border:2px solid var(--ink);box-shadow:0 6px 18px rgba(0,0,0,.55);transition:width .25s,height .25s,border-radius .25s}
.pin-photo img{width:100%;height:100%;object-fit:cover}
.pin-name{margin-top:6px;padding:3px 9px;border-radius:999px;background:rgba(6,9,18,.86);font-size:13px;font-weight:600;white-space:nowrap;line-height:1.3;text-align:center}
.pin-name .zh{display:none;font-size:12px;font-weight:700;color:var(--ink-2)}
.pin-tick{position:absolute;top:-4px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--amber);color:var(--amber-ink);display:none;place-items:center;box-shadow:0 0 0 2px var(--space)}
.pin.answered .pin-tick{display:grid}
.pin-wrap{position:relative}
.pin.active .pin-photo{border-color:var(--amber);box-shadow:0 0 0 4px var(--amber-soft),0 8px 22px rgba(0,0,0,.6)}
.pin.active::after{background:var(--amber)}
.zoom-far .pin-photo{width:34px;height:34px}
.zoom-far .pin-name{display:none}
.zoom-near .pin-photo{width:136px;height:88px;border-radius:12px}
.zoom-near .pin-name{border-radius:10px;padding:5px 10px}
.zoom-near .pin-name .zh{display:block}
.pin.hotel .pin-photo{background:var(--amber);color:var(--amber-ink);display:grid;place-items:center;border-color:var(--amber)}
.zoom-near .pin.hotel .pin-photo{width:52px;height:52px;border-radius:50%}
.pin.hotel .pin-name{background:var(--amber);color:var(--amber-ink)}
.pin.hotel::after{background:var(--amber)}
.pin-photo .ph-fallback{font-size:13px}
.zoom-near .pin-photo .ph-fallback{font-size:24px}
.chip .th .ph-fallback{font-size:12px;padding:0}
.ph-fallback{width:100%;height:100%;display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,#25304f,#10162a 70%);color:rgba(236,241,250,.55);font-family:var(--zh);font-weight:900;font-size:22px;letter-spacing:.06em;text-align:center;line-height:1.1;padding:6px}

.rail{position:absolute;z-index:500;top:calc(var(--topbar) + var(--safe-t) + 12px);left:0;right:0;display:flex;gap:8px;overflow-x:auto;padding:2px clamp(14px,3vw,32px) 8px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail-intro{flex-shrink:0;align-self:center;padding:7px 13px;border-radius:999px;background:var(--glass);border:1px solid var(--line-2);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:14px;color:var(--ink-2);white-space:nowrap}
.rail-intro b{color:var(--ink)}
.chip{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:999px;border:1px solid var(--line-2);background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:rgba(236,241,250,.35)}
.chip .th{width:28px;height:28px;border-radius:50%;overflow:hidden;background:var(--panel-2);flex-shrink:0}
.chip .th img{width:100%;height:100%;object-fit:cover}
.chip .ok{width:16px;height:16px;border-radius:50%;background:var(--amber);color:var(--amber-ink);display:grid;place-items:center}
.chip[aria-pressed="true"]{border-color:var(--amber);background:rgba(40,28,6,.8)}
.chip.hotel .th{background:var(--amber);color:var(--amber-ink);display:grid;place-items:center}

.sheet{position:absolute;z-index:800;top:calc(var(--topbar) + var(--safe-t) + 12px);right:12px;bottom:12px;width:min(452px,42vw);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r-lg);overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6);transform:translateX(calc(100% + 30px));transition:transform .42s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sheet-close{position:absolute;z-index:3;top:12px;right:12px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line-2);background:rgba(6,9,18,.7);backdrop-filter:blur(8px);display:grid;place-items:center;cursor:pointer}
.sheet-close:hover{background:rgba(6,9,18,.9)}
.sheet-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain}
.gal-hero{position:relative;aspect-ratio:16/10;background:var(--panel-2);overflow:hidden}
.gal-hero img{width:100%;height:100%;object-fit:cover}
.gal-hero .ph-fallback{font-size:56px}
.gal-credit{position:absolute;left:10px;bottom:8px;font-size:11.5px;color:rgba(236,241,250,.85);background:rgba(0,0,0,.45);padding:2px 8px;border-radius:999px;text-decoration:none}
.gal-thumbs{display:flex;gap:6px;padding:8px 18px 0;overflow-x:auto;scrollbar-width:none}
.gal-thumbs::-webkit-scrollbar{display:none}
.gal-thumbs button{flex-shrink:0;width:64px;height:44px;border-radius:8px;overflow:hidden;border:2px solid transparent;padding:0;background:var(--panel-2);cursor:pointer;opacity:.7}
.gal-thumbs button[aria-current="true"]{border-color:var(--ink);opacity:1}
.gal-thumbs img{width:100%;height:100%;object-fit:cover}
.sheet-body{padding:18px 22px 28px}
.names{display:flex;align-items:baseline;justify-content:space-between;gap:14px}
.names h2{margin:0;font-size:27px;font-weight:600;letter-spacing:-.015em;line-height:1.12}
.names .zh{font-size:28px;font-weight:900;letter-spacing:.06em;color:var(--ink);white-space:nowrap;line-height:1}
.subline{margin:6px 0 0;font-size:14.5px;color:var(--mute)}
.subline .py{color:var(--ink-2)}
.zh-full{margin:4px 0 0;font-size:14px;color:var(--mute)}
.zh-full span{font-family:var(--zh);color:var(--ink-2)}
.lede{margin:16px 0 0;font-size:18px;line-height:1.45;color:var(--ink)}
.desc p{margin:14px 0 0;color:var(--ink-2);font-size:15.5px;line-height:1.65}
.facts-list{margin:22px 0 0;display:grid;grid-template-columns:auto 1fr;border-top:1px solid var(--line)}
.facts-list dt,.facts-list dd{padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px;margin:0}
.facts-list dt{color:var(--mute);padding-right:18px}
.facts-list dd{color:var(--ink)}
.vibe{margin-top:22px;border-radius:var(--r-md);padding:22px 20px 18px;background:radial-gradient(120% 120% at 0% 0%,#1d1530 0%,#0b0f1d 60%);border:1px solid var(--line)}
.neon{margin:0;font-family:var(--zh);font-weight:900;font-size:40px;letter-spacing:.12em;color:#ffe7f0;text-shadow:0 0 6px #ff6fa8,0 0 18px #ff4f93,0 0 42px rgba(255,79,147,.55)}
.neon-2{margin:4px 0 0;font-size:15px;color:#bfe9ff;letter-spacing:.02em;text-shadow:0 0 8px rgba(110,200,255,.7)}
.vibe-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.vibe-tags span{font-size:13.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-2)}
.vibe-times{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.vibe-times div{background:rgba(236,241,250,.04);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--ink-2)}

/* ---------- Results ---------- */

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const D2R = Math.PI / 180;
const ALL = [...PLACES, ...MASSAGE, ...GA_PINS, HOTEL];

function km(a, b) {
  const dLat = (b.lat - a.lat) * D2R, dLon = (b.lon - a.lon) * D2R;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * D2R) * Math.cos(b.lat * D2R) * Math.sin(dLon / 2) ** 2;
  return 2 * 6371 * Math.asin(Math.sqrt(h));
}
function fmtDur(t) { const m = Math.round(t / 60000), h = Math.floor(m / 60), r = m % 60; return h ? (r ? `${h}h ${r}m` : `${h}h`) : `${r}m`; }
function fmtCountdown(t) { const d = Math.floor(t / 864e5); return d >= 2 ? `${d} days` : fmtDur(t); }
function local(iso) {
  const [y, m, d] = iso.slice(0, 10).split('-').map(Number);
  const day = new Date(Date.UTC(y, m - 1, d)).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' }).replace(/,/g, '');
  return { date: iso.slice(0, 10), time: iso.slice(11, 16), day };
}

/* Shared answers (Firebase). Works without it: answers then stay on this device. */
const TRIP_ID = 'chengdu2026';
const FIREBASE_VERSION = '12.19.0';
const Sync = (() => {
  const cfg = window.FIREBASE_CONFIG;
  let F = null, db = null, live = false, failed = false;
  const onErr = err => {
    console.warn('Database error', err);
    if (failed) return; failed = true;
    toast(err && err.code === 'permission-denied' ? 'The database blocked this. Check the Firestore rules.' : 'Can\'t reach the shared answers right now. Saving on this device.', 4200);
  };
  async function start() {
    if (!cfg || !cfg.apiKey || !cfg.projectId || /PASTE/.test(cfg.apiKey)) return;
    try {
      const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/`;
      const [app, fs] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-firestore.js')]);
      F = fs; db = F.getFirestore(app.initializeApp(cfg));
      F.onSnapshot(F.collection(db, 'trips', TRIP_ID, 'people'), snap => {
        const answers = {}, ranks = {};
        snap.forEach(d => { const v = d.data() || {}; answers[d.id] = v.answers || {}; ranks[d.id] = v.ranks || {}; });
        state.data.answers = answers; state.data.ranks = ranks;
        if (!live) { live = true; document.body.classList.add('is-live'); }
        LS.set('cd26.votes', state.data);

    const dx = (vb.x - va.x) * camera.aspect, dy = vb.y - va.y;
    if (Math.hypot(dx, dy) > 1e-4) lastRot = Math.atan2(dy, dx) - Math.PI / 2;
    planeMat.rotation = lastRot;
    planeMat.opacity = local > travel ? Math.max(0, 1 - (local - travel) / 1.2) : Math.min(1, local / 0.6);
    plane.visible = true;
  }
  function frame(now) {
    if (!running) return;
    raf = requestAnimationFrame(frame);
    const t = now / 1000;
    if (!reduceMotion) { qSway.setFromAxisAngle(yAxis, Math.sin(t * 0.12) * 0.04); globe.quaternion.copy(qBase).premultiply(qSway); }
    scene.updateMatrixWorld();
    updateSun();
    if (ready) {
      const el = now - drawStart;
      const p1 = reduceMotion ? 1 : Math.min(1, Math.max(0, (el - 400) / 2600));
      const p2 = reduceMotion ? 1 : Math.min(1, Math.max(0, (el - 2800) / 2000));
      setDraw(routeOut, 1 - (1 - p1) ** 3); setDraw(routeRet, p2);
      if (!reduceMotion) updatePlane((el - 3200) / 1000); else plane.visible = false;
      updateLabels(p1 > 0.6);

  }

    va = new THREE.Vector3(); vb = new THREE.Vector3(); vc = new THREE.Vector3(); camPos = new THREE.Vector3();
    q = new THREE.Quaternion(); qBase = new THREE.Quaternion(); qSway = new THREE.Quaternion(); yAxis = new THREE.Vector3(0, 1, 0);
    const canvas = $('#globe');
    try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' }); }
    catch (e) { console.warn('WebGL unavailable', e); return; }
    const small = Math.min(innerWidth, innerHeight) < 700;
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, small ? 1.6 : 2));
    renderer.setClearColor(0x000000, 0);
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(30, 1, 0.1, 400);
    root = new THREE.Group(); scene.add(root);
    globe = new THREE.Group(); root.add(globe);
    earthMat = new THREE.ShaderMaterial({ uniforms: { dayMap: { value: null }, nightMap: { value: null }, sunDir: { value: new THREE.Vector3(1, 0, 0) }, hasTex: { value: 0 } }, vertexShader: EARTH_VS, fragmentShader: EARTH_FS });
    const seg = small ? 80 : 128;
    globe.add(new THREE.Mesh(new THREE.SphereGeometry(1, seg, seg / 2), earthMat));
    halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: haloTex(), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
    root.add(halo);
    addStars();
    routeRet = buildRoute('return', 0x9fc4ff, 0.32, false);
    routeOut = buildRoute('outbound', 0xffb547, 0.95, true);

    const dt = dotTex();
    for (const [code, side] of [['LHR', 'left'], ['AMS', 'right'], ['HKG', 'below'], ['CTU', 'left']]) {
      const a = AIRPORTS[code], dest = code === 'CTU';
      const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: dt, color: dest ? 0xffb547 : 0xffffff, transparent: true, depthWrite: false }));
      s.position.copy(ll2v(a.lat, a.lon, 1.004)); s.scale.setScalar(dest ? 0.05 : 0.032); globe.add(s);
      const el = document.createElement('div'); el.className = 'g-label' + (dest ? ' dest' : ''); el.textContent = a.city; el.style.opacity = 0;
      $('#globeLabels').appendChild(el);
      labels.push({ s, el, side, w: 0 });
    }
    for (const it of routeOut) for (const p of it.pts) { if (pathPts.length && pathPts[pathPts.length - 1].distanceTo(p) < 1e-6) continue; pathPts.push(p); }
    pathCum = [0]; for (let i = 1; i < pathPts.length; i++) pathCum.push(pathCum[i - 1] + pathPts[i].distanceTo(pathPts[i - 1]));
    pathLen = pathCum[pathCum.length - 1];
    planeMat = new THREE.SpriteMaterial({ map: planeTex(), transparent: true, depthWrite: false });
    plane = new THREE.Sprite(planeMat); plane.scale.setScalar(0.06); plane.visible = false; globe.add(plane);

    layout();
    addEventListener('resize', layout);
    if (document.fonts) document.fonts.ready.then(() => labels.forEach(L => (L.w = 0)));

    const reveal = () => { if (ready) return; ready = true; canvas.classList.add('ready'); drawStart = performance.now(); };
    // Earth images are built into this page (NASA Blue Marble and Black Marble), so nothing has to download
    const loader = new THREE.TextureLoader();
    const load = url => new Promise((res, rej) => loader.load(url, res, undefined, rej));
    Promise.all([load('textures/earth-day.jpg'), load('textures/earth-night.jpg')]).then(([d, n]) => {
      const an = Math.min(8, renderer.capabilities.getMaxAnisotropy());
      d.anisotropy = an; n.anisotropy = an;
      earthMat.uniforms.dayMap.value = d; earthMat.uniforms.nightMap.value = n; earthMat.uniforms.hasTex.value = 1;
      reveal();
    }).catch(err => { console.warn('Globe textures failed', err); reveal(); });
    setTimeout(reveal, 9000);
  }
  function start() { if (!renderer || running) return; running = true; raf = requestAnimationFrame(frame); }
  function stop() { running = false; cancelAnimationFrame(raf); }
  document.addEventListener('visibilitychange', () => { if (document.hidden) stop(); else if (document.body.dataset.page === 'home') start(); });
  return {
    replay() { if (ready) drawStart = performance.now(); },
    show() {
      if (!inited) {
        inited = true;
        import(THREE_URL).then(m => { THREE = m; init(); if (document.body.dataset.page === 'home') start(); })
          .catch(err => console.warn('3D globe unavailable', err));
      } else start();
    },
    hide: stop,
  };
})();

function tripCard(key) {
  const { legs, t0, t1 } = tripTimes(key);
  let items = '';
  legs.forEach((l, i) => {
    const A = AIRPORTS[l.from], B = AIRPORTS[l.to], d = local(l.dep), a = local(l.arr), dur = fmtDur(ms(l.arr) - ms(l.dep));
    items += `<li class="leg">
      <div class="leg-meta"><span class="when">${d.day}</span><span class="fno">${l.no}</span><span>${l.airline}</span><span>${l.aircraft}</span></div>
      <div class="leg-main">
        <div class="pt"><div class="time">${d.time}</div><div class="code">${l.from}</div><div class="ap">${A.name}${l.fromT ? '<br>' + l.fromT : ''}</div></div>
        <div class="leg-line" aria-hidden="true"><span>${dur}</span>${planeSvg(90, 18)}</div>
        <div class="pt end"><div class="time">${a.time}${a.date !== d.date ? '<sup title="Next day">+1</sup>' : ''}</div><div class="code">${l.to}</div><div class="ap">${B.name}${l.toT ? '<br>' + l.toT : ''}</div></div>
      </div>
      <p class="sr-only">Departs ${d.day} at ${d.time}, arrives ${a.day} at ${a.time}. Flight time ${dur}.</p>

    if (i < legs.length - 1) items += `<li class="conn">${clockSvg}<span>Connect in <b>${B.city}</b>, ${fmtDur(ms(legs[i + 1].dep) - ms(l.arr))}</span></li>`;
  });
  return `<section class="trip-card" aria-label="${TRIPS[key].title}">
    <div class="trip-top"><h2>${TRIPS[key].title}</h2><span class="total">Total <b>${fmtDur(t1 - t0)}</b></span></div>
    <div data-strip="${key}">${stripHTML(key)}</div>
    <ol class="legs">${items}</ol>
  </section>`;
}

// Free map with no API key: OpenFreeMap (vector, drawn flat). Falls back to Esri tiles if that can't load.
const BaseMap = (() => {
  const OFM = { bright: 'https://tiles.openfreemap.org/styles/liberty', dark: 'https://tiles.openfreemap.org/styles/dark' };
  const OFM_ATTR = '<a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> &copy; <a href="https://www.openmaptiles.org/" target="_blank" rel="noopener">OpenMapTiles</a> Data from <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>';
  const ESRI = {
    bright: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', 19],
    dark: ['https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', 16],
  };
  const ML_JS = 'https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js';
  const ML_CSS = 'https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css';
  const ML_LEAFLET = 'https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js';
  const loadJS = src => new Promise((res, rej) => { const el = document.createElement('script'); el.src = src; el.onload = res; el.onerror = rej; document.head.appendChild(el); });
  const loadCSS = href => { const el = document.createElement('link'); el.rel = 'stylesheet'; el.href = href; document.head.appendChild(el); };
  let mlReady = null;
  const loadML = () => mlReady || (mlReady = (async () => {
    if (!window.maplibregl) { loadCSS(ML_CSS); await loadJS(ML_JS); }
    if (!L.maplibreGL) await loadJS(ML_LEAFLET);
  })());
  function attach(map, style) {
    let gl = null, raster = null, styleOk = false, useRaster = false, cur = style;
    function rasterBase() {
      useRaster = true;
      if (gl) { map.removeLayer(gl); gl = null; }
      if (raster) map.removeLayer(raster);
      const [url, nz] = ESRI[cur];
      raster = L.tileLayer(url, { maxZoom: 19, maxNativeZoom: nz, attribution: 'Tiles &copy; Esri' }).addTo(map);
    }
    function watch() {
      styleOk = false;
      gl.getMaplibreMap().once('styledata', () => { styleOk = true; });
      setTimeout(() => { if (!styleOk && !useRaster) { console.warn('Vector map timed out, using fallback tiles'); rasterBase(); } }, 10000);
    }
    (async () => {
      try {
        await loadML();
        gl = L.maplibreGL({ style: OFM[cur], attribution: OFM_ATTR }).addTo(map);
        gl.getMaplibreMap().on('error', e => { if (!styleOk && !useRaster) { console.warn('Vector map failed', e && e.error); rasterBase(); } });
        watch();
      } catch (e) { console.warn('Vector map unavailable', e); rasterBase(); }
    })();
    return { set(st) { cur = st; if (useRaster) rasterBase(); else if (gl) { gl.getMaplibreMap().setStyle(OFM[st]); watch(); } } };
  }
  return { attach };
})();

      if (found.length) { imgCache['ga-' + g.id] = { t: Date.now(), list: found.slice(0, 6) }; LS.set(IMG_KEY, imgCache); }

let sortBy = 'score', hideNo = false;

          const c = answeredCount(i), rk = rankCount(i), fin = c === PLACES.length && topDone(i);
          return `<li class="person"><span class="avatar" aria-hidden="true">${esc(initials(n))}</span>
            <div><div class="nm">${esc(n)}${i === state.me ? ' <small>That\'s you</small>' : ''}</div><div class="bar" aria-hidden="true"><i style="width:${((c + rk) / (PLACES.length + NEED_RANKS)) * 100}%"></i></div><small style="display:block;margin-top:6px;color:var(--mute);font-size:13px">${c} of ${PLACES.length} places, ${rk} of ${NEED_RANKS} getaways ranked</small></div>
            <span class="tag${fin ? ' done' : ''}">${fin ? 'Done' : 'In progress'}</span></li>`;
        }).join('')}</ul>
        <div class="lock-actions">
          ${state.me == null ? `<button class="btn primary" type="button" data-who>Choose your name</button>` : `${!meDone ? `<a class="btn primary" href="#/explore">Answer your places ${arrowSvg()}</a>` : ''}${!meTop ? `<a class="btn${meDone ? ' primary' : ''}" href="#/getaways">Pick your top 3 getaways ${arrowSvg()}</a>` : ''}`}
          ${state.me === ORGANISER ? `<button class="btn" type="button" id="revealNow">Reveal now</button>` : ''}
        </div>
      </div>` + betaNote();
    return;
  }
  const rows = PLACES.map(p => {
    const vals = TRAVELLERS.map((_, i) => myAnswers(i)[p.id]);

    return { p, vals, score: given.reduce((s, v) => s + v, 0), spread: given.length ? Math.max(...given) - Math.min(...given) : 9, hasNo: given.includes(0), complete: given.length === vals.length, dist: km(HOTEL, p) };
  });
  const sorters = {
    score: (a, b) => b.score - a.score || a.spread - b.spread,
    agree: (a, b) => a.spread - b.spread || b.score - a.score,

  const rank = {};

    return `<li class="row" data-open="${r.p.id}" tabindex="0" role="link" aria-label="${esc(r.p.en)}: ${r.score} of ${max} points. Open on the map">
      <span class="rank">${rank[r.p.id]}</span>
      <span class="th">${imgHTML(gallery[r.p.id][0], '', r.p.zh, false, true)}</span>
      <div><h3>${esc(r.p.en)} <span class="zh" lang="zh">${r.p.zh}</span>${r.p.type === 'daytrip' ? '<span class="type-tag daytrip">Day trip</span>' : ''}</h3>
        <div class="votes">${r.vals.map((v, i) => {
          const Lv = LEVELS.find(x => x.v === v), ini = `<span class="avatar" aria-hidden="true">${esc(initials(TRAVELLERS[i]))}</span>`;
          return Lv ? `<span class="vote" style="--c:${Lv.c}" title="${esc(TRAVELLERS[i])}">${ini}<i></i>${Lv.label}</span>` : `<span class="vote none" title="${esc(TRAVELLERS[i])}">${ini}No answer yet</span>`;
        }).join('')}</div></div>
      <div class="score"><span class="n">${r.score}<small> / ${max}</small></span>${agree}</div>
    </li>`;
  };
  const gaRows = GETAWAYS.map(g => { const rs = TRAVELLERS.map((_, i) => myRanks(i)[g.id] || 0); return { g, rs, pts: rs.reduce((t, r) => t + (RANK_PTS[r] || 0), 0), firsts: rs.filter(r => r === 1).length }; })
    .sort((a, b) => b.pts - a.pts || b.firsts - a.firsts);
  const gaRank = []; gaRows.forEach((r, i) => { gaRank[i] = i && gaRows[i - 1].pts === r.pts ? gaRank[i - 1] : i + 1; });
  const gaHTML = `<h2 class="res-h">2 days, 1 night</h2><p class="res-sub">#1 earns 3 points, #2 earns 2, #3 earns 1.</p>
    <ol class="rows">${gaRows.map((r, i) => `<li class="row" data-goga="${r.g.id}" tabindex="0" role="link" aria-label="${esc(r.g.en)}: ${r.pts} points. Open">
      <span class="rank">${gaRank[i]}</span><span class="th">${LOCAL_T[r.g.photos[0]] ? `<img src="${LOCAL_T[r.g.photos[0]]}" alt="">` : `<div class="ph-fallback">${r.g.zh}</div>`}</span>
      <div><h3>${esc(r.g.en)} <span class="zh" lang="zh">${r.g.zh}</span></h3>
        <div class="votes">${r.rs.map((rk, j) => `<span class="vote${rk ? '' : ' none'}" style="--c:var(--amber)" title="${esc(TRAVELLERS[j])}"><span class="avatar" aria-hidden="true">${esc(initials(TRAVELLERS[j]))}</span>${rk ? `<i></i>#${rk}` : 'Not in top 3'}</span>`).join('')}</div></div>
      <div class="score"><span class="n">${r.pts}<small> pts</small></span>${r.firsts ? `<span class="agree all">${r.firsts}× first choice</span>` : ''}</div></li>`).join('')}</ol>
    <h2 class="res-h">Places</h2>`;
  el.innerHTML = head + `<p class="page-sub">${everyoneDone() ? 'Everyone has answered. Here\'s how it all stacks up.' : 'Revealed early, so some answers are still missing.'}</p>
    ${gaHTML}
    <div class="controls">
      <div class="seg-ctl" role="group" aria-label="Sort by">${[['score', 'Top score'], ['agree', 'Most agreed'], ['near', 'Nearest hotel'], ['name', 'A to Z']].map(([k, l]) => `<button type="button" data-sort="${k}" aria-pressed="${sortBy === k}">${l}</button>`).join('')}</div>
      <label class="toggle"><input type="checkbox" id="hideNo"${hideNo ? ' checked' : ''}> Hide places with a "No"</label>
    </div>
    <div class="legend">${LEVELS.map(Lv => `<span><i style="--c:${Lv.c}"></i>${Lv.label} = ${Lv.v}</span>`).join('')}</div>
    ${list.length ? `<ol class="rows">${list.map(row).join('')}</ol>` : `<div class="no-rows">Every place got at least one "No". Turn off the filter to see them all.</div>`}
    ${state.data.revealed && !everyoneDone() && state.me === ORGANISER ? `<p style="margin-top:20px"><button class="btn" type="button" id="hideAgain">Hide results again</button></p>` : ''}` + betaNote();
}
$('#resultsBody').addEventListener('click', e => {
  const ga = e.target.closest('[data-goga]'); if (ga) { go('getaways', ga.dataset.goga); return; }
  const s = e.target.closest('[data-sort]'); if (s) { sortBy = s.dataset.sort; renderResults(); return; }
  if (e.target.closest('#revealNow')) { if (confirm('Show everyone\'s answers now, even though not everyone has finished?')) { state.data.revealed = true; save(); renderResults(); } return; }
  if (e.target.closest('#hideAgain')) { state.data.revealed = false; save(); renderResults(); return; }
  if (e.target.closest('#clearAll')) { if (confirm('Clear every answer from all three people? This can\'t be undone.')) { state.data = { answers: {}, ranks: {}, revealed: false }; LS.set('cd26.votes', state.data); Sync.clearAll(); refreshAll(); Getaways.refresh(); toast('All answers cleared'); } }
});
$('#resultsBody').addEventListener('change', e => { if (e.target.id === 'hideNo') { hideNo = e.target.checked; renderResults(); } });
$('#resultsBody').addEventListener('keydown', e => { const r = e.target.closest('.row'); if (r && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); r.click(); } });

/* =====================================================================
   10. WHO ARE YOU
   ===================================================================== */
let whoAfter = null, whoRequired = false;
function openWho(after, required) {
  whoAfter = after || null; whoRequired = !!required;
  $('#whoDialog').classList.toggle('intro', whoRequired);
  $('#whoTitle').textContent = whoRequired ? 'Who are you?' : 'Who\'s this?';
  $('#whoSub').textContent = whoRequired ? 'Pick your name to start.' : 'Pick your name so your answers are saved as yours.';
  $('#whoCancel').hidden = whoRequired;
  $('#whoList').innerHTML = TRAVELLERS.map((n, i) => `<button type="button" data-i="${i}"${state.me === i ? ' aria-current="true"' : ''}><span class="avatar" aria-hidden="true">${esc(initials(n))}</span>${esc(n)}</button>`).join('');
  const d = $('#whoDialog');
  if (typeof d.showModal === 'function') d.showModal(); else d.setAttribute('open', '');
}
$('#whoList').addEventListener('click', e => {
  const b = e.target.closest('button[data-i]'); if (!b) return;
  state.me = +b.dataset.i; LS.set('cd26.me', state.me);
  $('#whoDialog').close();
  toast(`Hi, ${TRAVELLERS[state.me]}`);
  refreshAll();
  if (whoAfter) whoAfter();
});
$('#whoCancel').addEventListener('click', () => $('#whoDialog').close());
$('#whoDialog').addEventListener('cancel', e => { if (whoRequired) e.preventDefault(); });
function renderWho() {
  const b = $('#whoChip');
  if (state.me == null) { b.innerHTML = `<span class="avatar empty" aria-hidden="true">?</span><span class="nm">Who are you?</span>`; b.setAttribute('aria-label', 'Choose who you are'); }
  else { const n = TRAVELLERS[state.me]; b.innerHTML = `<span class="avatar" aria-hidden="true">${esc(initials(n))}</span><span class="nm">${esc(n)}</span>`; b.setAttribute('aria-label', `You are ${n}. Switch person`); }
  $('#hello').innerHTML = state.me == null
    ? `Hello! <button class="link-btn" type="button" data-who>Tell us who you are</button>`
    : `Hello, <strong>${esc(TRAVELLERS[state.me])}</strong> <button class="link-btn" type="button" data-who>Not you?</button>`;
}
$('#whoChip').addEventListener('click', () => openWho());

/* =====================================================================
   11. ROUTER & START
   ===================================================================== */
function go(page, arg) { location.hash = '#/' + (page === 'home' ? '' : page) + (arg ? '/' + arg : ''); }
function refreshAll() {
  renderWho();
  Explore.refresh();
  Getaways.refresh();
  if (document.body.dataset.page === 'results') renderResults();
}
const TITLES = { home: 'Chengdu, December 2026', journey: 'Your journey', explore: 'Explore Chengdu', getaways: '2 days, 1 night', results: 'Results' };
function route() {
  const parts = location.hash.replace(/^#\/?/, '').split('/');
  const page = ['journey', 'explore', 'getaways', 'results'].includes(parts[0]) ? parts[0] : 'home';
  const prev = document.body.dataset.page;
  document.body.dataset.page = page;
  $$('.page').forEach(s => s.classList.toggle('is-active', s.id === 'page-' + page));
  $$('.tabs a').forEach(a => (a.dataset.page === page ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current')));
  document.title = TITLES[page];
  if (page === 'home') { renderHomeStrip(); Home.show(); } else Home.hide();
  if (page === 'journey') renderJourney();
  if (page === 'results') renderResults();
  if (page === 'explore') Explore.show(parts[1] || null);
  if (page === 'getaways') Getaways.show(parts[1] || null);
  if (prev !== page && page !== 'explore') window.scrollTo(0, 0);
}
document.addEventListener('click', e => {
  if (e.target.closest('[data-who]')) { openWho(); return; }
  const o = e.target.closest('[data-open]');
  if (o) { if (document.body.dataset.page === 'explore') Explore.open(o.dataset.open); else go('explore', o.dataset.open); }
});
Sync.start();
addEventListener('storage', e => { if (Sync.live) return; if (e.key === 'cd26.votes') { state.data = LS.get('cd26.votes', { answers: {}, revealed: false }); refreshAll(); } });
setInterval(() => {
  const pg = document.body.dataset.page;
  if (pg === 'home') renderHomeStrip();
  if (pg === 'journey') $$('[data-strip]').forEach(el => (el.innerHTML = stripHTML(el.dataset.strip)));
}, 30000);

renderWho();
addEventListener('hashchange', route);
// Every new visit starts by asking who you are, over a blurred background
let introAsked = false;
try { introAsked = sessionStorage.getItem('cd26.asked') === '1'; } catch {}
if (!introAsked) document.body.classList.add('intro-wait');
route();
if (!introAsked) openWho(() => {
  try { sessionStorage.setItem('cd26.asked', '1'); } catch {}
  document.body.classList.remove('intro-wait');
  Home.replay();
}, true);
</script>
</body>
